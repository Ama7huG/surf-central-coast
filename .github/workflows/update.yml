# Every hour: fetch the forecasts (surf.py) and publish the web/ folder on GitHub Pages.
# The generated web/data.js is NOT committed (it would add ~13 MB of history per day);
# it only lives in the published site.
name: Update forecast

on:
  schedule:
    - cron: "17 * * * *"     # every hour at :17 (GitHub may start it 10-20 min late)
  push:
    branches: [main]
  workflow_dispatch:          # "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch forecasts
        run: python surf.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
